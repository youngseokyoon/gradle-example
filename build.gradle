plugins {
    id 'groovy'
    id 'application'
    id 'com.gradleup.shadow' version '9.1.0'
    id 'com.google.cloud.tools.jib' version '3.4.1'
}

jib {
    from {
        image = 'eclipse-temurin:25-jdk'
    }
    to {
        image = 'ghcr.io/youngseokyoon/gradle-example:latest'
    }
    container {
        jvmFlags = ['-Xms512m', '-Xmx1024m']
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}

base.archivesName = 'gradle-example'

dependencies {
    // Groovy BOM
    implementation platform('org.apache.groovy:groovy-bom:5.+')

    // Groovy module dependency
    implementation 'org.apache.groovy:groovy-json'

    // Strictly exact version of Maven dependency
    implementation 'com.codevineyard:hello-world:1.0.1!!'

    // Dependency from local jar
    implementation ':simple-jar'
}

application {
    mainClass = 'com.adjectivecolournoun.gradle.Greetz'
}